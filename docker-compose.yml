services:
  postgres:
    image: postgres:16-alpine
    container_name: crm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-whatsapp_crm}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-whatsapp_crm}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - crm_internal

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: crm_server
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      API_PREFIX: /api/v1
      CLIENT_URL: http://localhost:5173
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-whatsapp_crm}?schema=public
      JWT_SECRET: dev_jwt_secret_key_crm_development_32chars_min
      WHATSAPP_ENABLED: "true"
      WHATSAPP_MODE: mock
      WHATSAPP_API_VERSION: v21.0
      CAMPAIGN_WORKER_ENABLED: "true"
      LOG_LEVEL: info
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - crm_internal

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:5000/api/v1
    container_name: crm_client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - crm_internal

volumes:
  pgdata:
    name: crm_pgdata

networks:
  crm_internal:
    name: crm_internal_net
    driver: bridge
