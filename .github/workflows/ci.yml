name: Continuous Integration & Production Quality Gate

on:
  push:
    branches: [ main, develop, feature/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-and-database-checks:
    name: Backend Tests, Schema Validation & Migration Replay
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: crm_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Verify clean migration replay on fresh PostgreSQL
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/crm_ci_test?schema=public

      - name: Verify migration status
        run: npx prisma migrate status
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/crm_ci_test?schema=public

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run backend automated test suite
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_jwt_secret_key_minimum_32chars_for_security_checks
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/crm_ci_test?schema=public
          WHATSAPP_MODE: mock

  frontend-checks:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend production bundle
        run: npm run build
        env:
          VITE_API_BASE_URL: /api/v1

  docker-build-checks:
    name: Container Build & Multi-stage Verification
    runs-on: ubuntu-latest
    needs: [backend-and-database-checks, frontend-checks]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: stech/whatsapp-crm-server:ci-test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: false
          tags: stech/whatsapp-crm-client:ci-test
