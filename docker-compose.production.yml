services:
  postgres:
    image: postgres:16-alpine
    container_name: crm_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-whatsapp_crm}
    volumes:
      - crm_prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-whatsapp_crm}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - crm_backend_net
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: crm_prod_server
    restart: always
    env_file:
      - ./server/.env.production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - crm_backend_net
      - crm_frontend_net
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${CLIENT_API_URL:-/api/v1}
    container_name: crm_prod_client
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - crm_frontend_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 128M

volumes:
  crm_prod_pgdata:
    name: crm_prod_pgdata

networks:
  crm_backend_net:
    name: crm_backend_net
    internal: true
  crm_frontend_net:
    name: crm_frontend_net
